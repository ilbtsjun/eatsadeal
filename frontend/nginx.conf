map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

map $request_uri $canonical_path {
    default                                   /;
    ~^/events/(?<cid>[0-9]+)/?(?:\?.*)?$      /events/$cid;
    ~^/terms/?(?:\?.*)?$                      /terms;
    ~^/privacy/?(?:\?.*)?$                    /privacy;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;

    location /api/crawl {
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 600s;
        }

    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/seo/sitemap.xml;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~ ^/events/(?<event_id>[0-9]+)/?$ {
        rewrite ^ /api/seo/events/$event_id break;
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        sub_filter 'rel="canonical" href="https://www.eatsadeal.kr/"' 'rel="canonical" href="https://www.eatsadeal.kr$canonical_path"';
        sub_filter 'property="og:url" content="https://www.eatsadeal.kr/"' 'property="og:url" content="https://www.eatsadeal.kr$canonical_path"';
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        sub_filter 'rel="canonical" href="https://www.eatsadeal.kr/"' 'rel="canonical" href="https://www.eatsadeal.kr$canonical_path"';
        sub_filter 'property="og:url" content="https://www.eatsadeal.kr/"' 'property="og:url" content="https://www.eatsadeal.kr$canonical_path"';
        try_files $uri /index.html;
    }
}
