map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

map $http_user_agent $is_preview_bot {
    default 0;
    ~*(kakaotalk-scrap|facebookexternalhit|twitterbot|slackbot|discordbot|telegrambot|linkedinbot|whatsapp|yeti|daumoa) 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;

    location /api/crawl {
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 600s;
        }

    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/seo/sitemap.xml;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~ ^/events/(?<event_id>[0-9]+)/?$ {
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        if ($is_preview_bot) {
            rewrite ^ /api/seo/events/$event_id break;
            proxy_pass http://backend:8080;
        }
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
