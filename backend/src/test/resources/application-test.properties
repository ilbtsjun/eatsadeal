# DataSource & Flyway 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT 설정
jwt.secret=your-very-secure-and-long-jwt-secret-key-for-test-environment-1234567890
jwt.expiration=3600000

# CORS 설정
app.cors.allowed-origins=http://localhost:3000

# 메일 관련 테스트 설정
spring.mail.host=smtp.test.com
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
report.mail.to=test-report@test.com

app.crawler.schedule-enabled=false