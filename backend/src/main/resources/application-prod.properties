# =========================
# 운영 환경
# =========================

# MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/eatsadeal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=redis
spring.data.redis.password=${REDIS_PASSWORD}

# nginx 뒤에서 실제 클라이언트 IP를 쓰도록 (조회수, 로그인/제보 제한이 IP 기준)
server.forward-headers-strategy=native

# 운영에서 Swagger 비활성화
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 헬스체크
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate SQL 로그 비활성화
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# JWT
spring.jwt.secret=${JWT_SECRET}
jwt.secret=${JWT_SECRET}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# 애플리케이션 로그
logging.level.com.backend=INFO
logging.level.org.springframework=WARN

# 제보 메일 수신자 설정 (운영 환경)
report.mail.to=${REPORT_MAIL_TO}

# application-prod.properties
app.cors.allowed-origins=https://www.eatsadeal.com

# ADMIN 계정(운영 환경)
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
