# =========================
# 개발 환경
# =========================

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/eatsadeal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=localhost

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate SQL 로그
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# JWT
jwt.secret=${JWT_SECRET}

# Mailtrap
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# 애플리케이션 로그
logging.level.com.backend=DEBUG

# 제보 메일 수신자 설정 (개발 환경)
report.mail.to=${REPORT_MAIL_TO}

# application-dev.properties
app.cors.allowed-origins=http://localhost:5173

# ADMIN 계정(개발 환경)
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}